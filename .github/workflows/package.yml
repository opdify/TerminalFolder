name: Package platform VSIX files

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx vsce package --target ${{ matrix.target }} --out terminal-folder-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v6
        with:
          name: terminal-folder-${{ matrix.target }}
          path: terminal-folder-${{ matrix.target }}.vsix
